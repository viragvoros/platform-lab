# Loki in SingleBinary mode — one pod, filesystem storage on an emptyDir.
# Ideal for a small kind cluster / Raspberry Pi. Not for production scale.

deploymentMode: SingleBinary

loki:
  storage:
    type: filesystem
  schemaConfig:
    configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
  commonConfig:
    replication_factor: 1
  auth_enabled: false
  limits_config:
    retention_period: 24h

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  persistence:
    enabled: false
  # Loki needs a writable dir; the container root is read-only and we
  # disabled persistence, so mount an ephemeral emptyDir at /var/loki.
  extraVolumes:
  - name: loki-data
    emptyDir: {}
  extraVolumeMounts:
  - name: loki-data
    mountPath: /var/loki

# Disable extras not needed for a lab.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
